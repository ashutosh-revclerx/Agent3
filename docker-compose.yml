version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: copilot-postgres
    environment:
      POSTGRES_USER: copilot_user
      POSTGRES_PASSWORD: copilot_password
      POSTGRES_DB: copilot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot_user -d copilot_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - copilot-network

  # Frontend service (optional, for full stack development)
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: copilot-frontend
  #   ports:
  #     - "5173:5173"
  #   depends_on:
  #     - backend
  #   networks:
  #     - copilot-network

volumes:
  postgres_data:
    driver: local

networks:
  copilot-network:
    driver: bridge
